<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>My map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: a full-bleed map of Canada steered by the cursor; each project opens as a letterboxed screening card. */
:root{
  /* light atlas: cream land, soft grey water, charcoal ink, burnt-amber markers */
  --ocean:#e2e4e0;
  --ocean-deep:#d9dcd8;
  --land:#f6f1e6;
  --land-north:#fcfbf7;
  --land-foreign:#ebe6da;
  --water-line:#8ea2a6;
  --border:rgba(43,40,34,.28);
  --label-region:rgba(43,40,34,.42);
  --label-foreign:rgba(43,40,34,.24);
  --label-water:rgba(84,110,118,.9);
  --ink:#f4efe5;
  --ink-2:#ece6d9;
  --line:#d8d0c1;
  --contour:#a99f8d;
  --paper:#2b2822;
  --muted:#7f786b;
  --tungsten:#c4741c;
  --tungsten-soft:rgba(196,116,28,.16);
  --scrim:rgba(244,239,229,.94);
  --card-bg:rgba(255,253,248,.78);
  --card-bg-fade:rgba(255,253,248,.5);
  --card-edge:rgba(255,255,255,.95);
  --card-edge-warm:rgba(196,116,28,.3);
  --halo:rgba(250,247,240,.95);
  --shadow:rgba(70,58,38,.22);
  --bar:#ebe5d8;
  --road:#9a6b3c;
  --body-2:#4d483f;
  --f-display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-cine:cubic-bezier(.22,.8,.12,1);
  --barH:0px;
  --filmH:600px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:3px}

/* ---------- map ---------- */
#stage{position:fixed;inset:0;overflow:hidden;perspective:2000px;touch-action:none;background:var(--ocean-deep)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#mapView{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 50%}
#cities{position:absolute;inset:0;pointer-events:none}
.city{position:absolute;width:0;height:0;transform:scale(var(--inv,1));transition:opacity .6s var(--ease-cine)}
.city i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--paper)}
.city.t3 i{left:-2px;top:-2px;width:4px;height:4px;background:var(--muted)}
.city.cap i{left:-4px;top:-4px;width:5px;height:5px;background:var(--ink);border:1.5px solid var(--paper)}
.city.nat i{left:-6px;top:-6px;width:12px;height:12px;border-radius:0;background:var(--paper);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.city span{position:absolute;top:0;white-space:nowrap;transform:translateY(-50%);
  font:600 13px/1 var(--f-body);color:var(--paper);letter-spacing:.01em;text-shadow:0 0 6px var(--halo),0 0 2px var(--halo),0 0 1px var(--halo)}
.city.t2 span{font-weight:500;font-size:12px}
.city.t3 span{font-weight:500;font-size:10.5px;color:var(--muted)}
.city.side-r span{left:var(--g,9px)}
.city.side-l span{right:var(--g,9px)}
.city.side-b span{left:0;top:calc(var(--g,9px) - 2px);transform:translateX(-50%)}
.city.side-t span{left:0;top:calc(2px - var(--g,9px));transform:translate(-50%,-100%)}
.city span,.city i{transition:opacity .45s var(--ease-cine)}
.city.lbl-off span,.city.t3.lbl-off i{opacity:0}
.region{position:absolute;white-space:nowrap;transform-origin:0 0;transform:scale(var(--inv,1)) translate(-50%,-50%);
  font:600 15px/1 var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--label-region);transition:opacity .45s var(--ease-cine)}
.region.sm{font-size:11px;letter-spacing:.16em}
.region.foreign{color:var(--label-foreign)}
.region.water{font:italic 500 12px/1 var(--f-body);letter-spacing:.08em;text-transform:none;color:var(--label-water)}
.region.water.sm{font-size:10.5px}
.region.lbl-off,body.is-flying .region{opacity:0}
body.is-flying .city{opacity:.25}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 45%,rgba(120,104,78,.16) 100%)}

.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;transform:scale(var(--inv,1));transform-origin:13px 13px;
  transition:opacity .6s var(--ease-cine);z-index:1}
.pin-mark{position:absolute;inset:4px;border:1.5px solid var(--tungsten);border-radius:50%;background:rgba(255,253,248,.9);
  transition:transform .5s var(--ease-cine),background .3s}
.pin[data-medium="photo"] .pin-mark{border-radius:2px;inset:5px}
.pin-mark::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--tungsten);border-radius:50%}
.pin::before{content:"";position:absolute;inset:0;border:1px solid var(--tungsten);border-radius:50%;opacity:0}
/* a marker pulses once when it becomes the one you're on, rather than every marker looping forever */
.pin.is-hot::before{animation:ping 1.1s var(--ease-cine) 1}
.pin:active .pin-mark{transform:scale(1.15);transition-duration:80ms}
.pin[data-medium="photo"]::before{border-radius:3px}
@keyframes ping{0%{transform:scale(.6);opacity:.7}70%,100%{transform:scale(2.4);opacity:0}}
.pin-label{position:absolute;left:32px;top:50%;transform:translateY(-50%);white-space:nowrap;display:flex;align-items:baseline;gap:8px;
  pointer-events:none;text-shadow:0 0 8px var(--halo),0 0 3px var(--halo),0 0 1px var(--halo);transition:opacity .4s,transform .5s var(--ease-cine)}
.pin.label-l .pin-label{left:auto;right:32px;flex-direction:row-reverse}
.pin.label-l:hover .pin-label,.pin.label-l.is-hot .pin-label{transform:translate(-4px,-50%)}
.pin-label b{font:500 10px/1 var(--f-mono);color:var(--tungsten);letter-spacing:.08em}
.pin-label span{font:600 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--paper)}
.pin:hover .pin-mark,.pin:focus-visible .pin-mark,.pin.is-hot .pin-mark{transform:scale(1.35);background:var(--tungsten-soft)}
.pin:hover .pin-label,.pin.is-hot .pin-label{transform:translate(4px,-50%)}
.pin.is-dim{opacity:.16;pointer-events:none}
.pin.is-dim .pin-label{opacity:0}
body.is-flying .pin:not(.is-active){opacity:0;pointer-events:none}
body.is-flying .pin-label{opacity:0}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;z-index:10;display:flex;justify-content:space-between;gap:16px;pointer-events:none;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  transition:opacity .7s var(--ease-cine),transform .9s var(--ease-cine)}
.hud .controls{pointer-events:auto} /* name card and readout let the cursor reach the map */
.hud-top{top:0;align-items:flex-start;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.hud-bottom{bottom:0;align-items:flex-end;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.is-flying .hud-top{opacity:0;transform:translateY(-16px);pointer-events:none}
body.is-flying .hud-bottom{opacity:0;transform:translateY(16px);pointer-events:none}
body.is-flying .hud .controls{pointer-events:none}

/* header card: frosted panel whose border fades out from the top-left corner */
.brand{position:relative;display:grid;gap:6px;padding:18px 24px 20px 22px;border-radius:6px;
  background:linear-gradient(140deg,var(--card-bg) 0%,var(--card-bg-fade) 100%);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 24px 60px -28px var(--shadow),0 1px 0 rgba(43,40,34,.06)}
.brand::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,var(--card-edge) 0%,transparent 55%,var(--card-edge-warm) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.eyebrow{font:400 11px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font:800 clamp(30px,3.4vw,46px)/.88 var(--f-display);text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance}
.brand p{margin:2px 0 0;font:400 13px/1.4 var(--f-body);color:var(--muted);max-width:30ch}

.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border:1px solid var(--line);border-top-color:var(--card-edge);
  background:var(--card-bg);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);color:var(--paper);display:inline-flex;gap:8px;align-items:center;
  transition:background .25s,color .25s,border-color .25s,transform .2s var(--ease-cine)}
/* feedback lands on press, not on release */
.chip:active,.bar-ui button:active,.thumb:active,.index li button:active,.preview.show:active{transform:scale(.97);transition-duration:100ms}
.chip:hover{border-color:var(--contour)}
.chip[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.chip small{font-size:10px;opacity:.7}
.glyph{display:inline-block;width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%}
.glyph.sq{border-radius:1px}

.readout{display:grid;gap:10px;font:400 11px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.readout .row{display:flex;gap:18px;flex-wrap:wrap}
.readout b{color:var(--paper);font-weight:500;font-variant-numeric:tabular-nums}
.readout .hint{color:var(--paper);opacity:.75}
.legend{display:flex;gap:14px;align-items:center}
.legend span{display:inline-flex;gap:7px;align-items:center}
.legend .glyph{color:var(--tungsten)}


/* ---------- hover preview ---------- */
.preview{position:fixed;left:0;top:0;z-index:15;width:250px;pointer-events:none;border-radius:6px;overflow:hidden;
  background:var(--card-bg);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(43,40,34,.1);border-top-color:var(--card-edge);box-shadow:0 30px 70px -30px var(--shadow);
  opacity:0;transform:scale(.92);transition:opacity .3s var(--ease-cine),transform .45s cubic-bezier(.2,.9,.25,1)}
.preview.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.preview img{display:block;width:100%;height:140px;object-fit:cover}
.preview .pv-body{padding:12px 14px 14px;display:grid;gap:6px}
.preview .pv-meta{font:400 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tungsten)}
.preview .pv-title{font:800 22px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.preview .pv-cta{font:400 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em}

/* ---------- letterbox ---------- */
.bar{position:fixed;left:0;right:0;height:var(--barH);background:var(--bar);z-index:30;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
.bar-ui{position:fixed;left:0;right:0;z-index:31;height:var(--barH);display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  font:400 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  opacity:0;pointer-events:none;transition:opacity .6s var(--ease-cine)}
.bar-ui.top{top:0}.bar-ui.bot{bottom:0}
body.film-open .bar-ui{opacity:1;pointer-events:auto}
.bar-ui b{color:var(--paper);font-weight:500}
.bar-ui button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--paper);display:inline-flex;gap:10px;align-items:center;padding:8px 0;min-width:0}
.bar-ui button:hover{color:var(--tungsten)}
.bar-ui .nb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-ui .count{font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.bar-ui .side{display:flex;align-items:center;gap:16px;min-width:0;flex:1}
.bar-ui .side.r{justify-content:flex-end}
kbd{font:inherit;border:1px solid var(--line);padding:2px 5px;color:var(--muted)}

/* ---------- film (project) overlay ---------- */
.film{position:fixed;left:0;right:0;top:var(--barH);bottom:var(--barH);z-index:20;overflow:auto;
  background:linear-gradient(90deg,rgba(244,239,229,.7),var(--scrim) 55%);opacity:0;transition:opacity .7s var(--ease-cine)}
.film.is-on{opacity:1}
.film-inner{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:clamp(24px,3vw,48px);align-items:center;
  padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box}
.screen-col{display:grid;gap:12px;justify-items:center;min-width:0}
.screen{position:relative;width:min(100%,calc((var(--filmH) - 90px) * var(--ar,1.78)));max-width:100%;aspect-ratio:var(--ar,1.78);background:#000;overflow:hidden;
  clip-path:inset(50% 0 50% 0);transition:clip-path 1.1s var(--ease-cine) .1s}
.film.is-on .screen{clip-path:inset(0 0 0 0)}
.screen .layer{position:absolute;inset:0;opacity:0;transform:scale(1.05);transition:opacity 1.1s var(--ease-cine),transform 1.6s var(--ease-cine)}
.screen .layer.in{opacity:1;transform:none}
.screen .media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.screen .media.kb{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1.2%,-.8%)}}
/* viewfinder frame lines */
.vf{position:absolute;inset:12px;pointer-events:none;z-index:2}
.vf i{position:absolute;width:18px;height:18px;border-color:rgba(235,230,218,.7);border-style:solid;border-width:0}
.vf i:nth-child(1){left:0;top:0;border-left-width:1px;border-top-width:1px}
.vf i:nth-child(2){right:0;top:0;border-right-width:1px;border-top-width:1px}
.vf i:nth-child(3){left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
.vf i:nth-child(4){right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
.vf::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
  background:linear-gradient(rgba(235,230,218,.5),rgba(235,230,218,.5)) center/1px 100% no-repeat,linear-gradient(rgba(235,230,218,.5),rgba(235,230,218,.5)) center/100% 1px no-repeat}
.screen-hud{position:absolute;left:22px;right:22px;top:20px;z-index:3;display:flex;justify-content:space-between;
  font:400 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(235,230,218,.85);text-shadow:0 1px 4px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
.rec{display:inline-flex;gap:6px;align-items:center}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#e2483d;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.caption{width:100%;display:flex;justify-content:space-between;gap:16px;font:400 11px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.caption b{color:var(--paper);font-weight:400}

.card{display:grid;gap:18px;align-content:center;min-width:0}
.slate{display:flex;gap:10px;flex-wrap:wrap;font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.slate span{padding:6px 8px;border:1px solid var(--line);color:var(--muted)}
.slate span:first-child{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.title{margin:0;font:800 clamp(44px,5vw,82px)/.86 var(--f-display);text-transform:uppercase;letter-spacing:-.015em;text-wrap:balance}
.title .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.04em}
.title .w > span{display:inline-block;transform:translateY(105%);transition:transform 1s var(--ease-cine);transition-delay:calc(var(--d,0) * 1ms)}
.film.is-on .title .w > span{transform:none}
.synopsis{margin:0;font:400 15px/1.6 var(--f-body);color:var(--body-2);max-width:46ch}
.meta{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:9px;border-top:1px solid var(--line);padding-top:16px}
.meta dt{font:400 10px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:0;font:500 13px/1.45 var(--f-body);color:var(--paper)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:64px;aspect-ratio:var(--ar,1.5);max-height:80px;overflow:hidden;border:1px solid var(--line);opacity:.55;transition:opacity .3s,border-color .3s,transform .4s var(--ease-cine)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:.9;transform:translateY(-2px)}
.thumb[aria-current="true"]{opacity:1;border-color:var(--tungsten)}
.thumb .play{position:absolute;right:4px;bottom:3px;font:500 9px/1 var(--f-mono);color:var(--paper);text-shadow:0 1px 3px #000}
.rv{opacity:0;transform:translateY(14px);transition:opacity .8s var(--ease-cine),transform .9s var(--ease-cine);transition-delay:calc(var(--d,0) * 1ms)}
.film.is-on .rv{opacity:1;transform:none}

/* ---------- index ---------- */
.index{position:fixed;top:0;bottom:0;right:0;z-index:25;width:min(380px,100%);background:rgba(250,247,240,.97);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .7s var(--ease-cine);box-sizing:border-box;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-right:env(safe-area-inset-right,0px)}
.index.open{transform:none}
.index header{display:flex;justify-content:space-between;align-items:center;padding:0 24px 16px;border-bottom:1px solid var(--line)}
.index header p{margin:4px 0 0;font:400 11px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.index h2{margin:0;font:800 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.index ol{list-style:none;margin:0;padding:8px 0;overflow:auto}
.index li button{width:100%;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-align:left;padding:10px 24px;transition:background .25s}
.index li button:hover{background:var(--ink-2)}
.index li img{width:72px;height:46px;object-fit:cover;display:block}
.index .ix-meta{font:400 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tungsten)}
.index .ix-title{display:block;margin-top:5px;font:600 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.index li.is-dim{display:none}

/* ---------- grain + intro ---------- */
.grain{position:fixed;inset:-50%;z-index:40;pointer-events:none;opacity:.035;animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.intro{position:fixed;inset:0;z-index:35;display:grid;place-items:center;pointer-events:none;transition:opacity .8s var(--ease-cine)}
.intro div{display:grid;gap:10px;justify-items:center;text-align:center;padding-inline:16px}
.intro .eyebrow{color:var(--tungsten)}
.intro strong{font:800 clamp(40px,8vw,96px)/.85 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.intro.gone{opacity:0}

@media (max-width:860px){
  .film-inner{grid-template-columns:minmax(0,1fr);align-items:start}
  .screen{width:100%}
  .readout .hint,.legend{display:none}
  .brand p{display:none}
  .bar-ui .nb{max-width:28vw}
}
@media (max-width:520px){
  .controls .chip small{display:none}
  .hud-top{flex-direction:column}
  .controls{justify-content:flex-start}
}
/* ---------- frosted glass ----------
   One material for every card, panel and control: a pale see-through fill that blurs and
   lightly saturates the map behind it, a hairline rim that catches light at the top-left and
   fades toward a faint amber at the bottom-right, and a soft two-layer shadow. Large panels
   get a stronger blur and deeper shadow than small chips. The project view keeps a blurred
   scrim behind its card rather than stacking glass on glass, so text stays legible. */
:root{
  --glass-fill:linear-gradient(140deg,rgba(255,255,255,.64),rgba(255,251,244,.36));
  --glass-fill-strong:linear-gradient(140deg,rgba(255,255,255,.84),rgba(255,251,244,.66));
  --glass-blur:blur(22px) saturate(170%);
  --glass-blur-sm:blur(14px) saturate(160%);
  --glass-rim:linear-gradient(140deg,rgba(255,255,255,.98),rgba(255,255,255,.2) 42%,rgba(196,116,28,.28));
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 24px 56px -28px rgba(70,58,38,.38),0 2px 8px -3px rgba(70,58,38,.14);
  --glass-shadow-sm:inset 0 1px 0 rgba(255,255,255,.7),0 8px 20px -12px rgba(70,58,38,.3);
}
.brand,.preview,.readout,.film .card,.index{background:var(--glass-fill);border:0;
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow)}
.chip{border:0;border-radius:999px;padding:9px 14px;-webkit-backdrop-filter:var(--glass-blur-sm);backdrop-filter:var(--glass-blur-sm);box-shadow:var(--glass-shadow-sm)}
.chip:not([aria-pressed="true"]){background:var(--glass-fill)}
.chip:hover:not([aria-pressed="true"]){background:var(--glass-fill-strong)}
.brand::before,.preview::before,.readout::before,.film .card::before,.index::before,.chip::before{content:"";position:absolute;inset:0;
  border-radius:inherit;padding:1px;pointer-events:none;background:var(--glass-rim);z-index:1;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.chip{position:relative}
.brand{border-radius:18px;padding:18px 24px 20px 22px}
.preview{border-radius:16px}
.preview img{border-radius:12px;margin:6px 6px 0;width:calc(100% - 12px);height:134px}
.readout{position:relative;border-radius:16px;padding:12px 16px 13px;gap:8px}
/* the side index floats as a glass sheet instead of a solid column */
.index{top:12px;bottom:12px;right:12px;width:min(380px,calc(100% - 24px));border-radius:22px;overflow:hidden;
  transform:translateX(calc(100% + 24px));padding-top:20px;padding-bottom:12px}
.index header{border-bottom-color:rgba(43,40,34,.1)}
.index li button{border-radius:12px;margin:0 8px;width:calc(100% - 16px);padding:10px 16px}
.index li button:hover{background:rgba(255,255,255,.55)}
.index li img{border-radius:8px}
/* project view: the map stays faintly visible through a blurred scrim, details sit on a glass card */
.film{background:rgba(244,239,229,.42);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.film .card{position:relative;background:var(--glass-fill-strong);border-radius:24px;padding:26px 26px 24px}
.screen{border-radius:14px;box-shadow:0 30px 60px -30px rgba(40,32,20,.55)}
.thumb{border-radius:8px;border-color:rgba(43,40,34,.12)}
.slate span{border-radius:999px;padding:6px 10px;border-color:rgba(43,40,34,.14);background:rgba(255,255,255,.45)}
.slate span:first-child{background:var(--paper);border-color:var(--paper)}
.meta{border-top-color:rgba(43,40,34,.1)}
/* letterbox bars become frosted strips over the scene */
.bar{background:rgba(247,243,235,.62);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.bar.top{box-shadow:inset 0 -1px 0 rgba(255,255,255,.7)}
.bar.bot{box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.bar-ui kbd{border-radius:6px;border-color:rgba(43,40,34,.18);background:rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){
  .pin::before,.pin.is-hot::before,.grain,.screen .media.kb,.rec::before{animation:none}
  .preview,.preview.show{transform:none}
  *:not(.preview):not(.film):not(.index){transition-duration:.01ms!important}
  .preview,.film{transition:opacity .2s ease!important}
}
@media (prefers-reduced-transparency:reduce){
  .brand,.preview,.chip:not([aria-pressed="true"]),.readout,.film .card,.index,.bar,.film{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--ink-2)}
}
@media (prefers-contrast:more){
  .brand,.preview,.chip:not([aria-pressed="true"]),.readout,.film .card,.index{background:var(--ink);border:1px solid var(--paper)}
  .brand::before,.preview::before,.readout::before,.film .card::before,.index::before,.chip::before{display:none}
}
</style>

/* ---------- map: Lambert conformal conic, Statistics Canada parameters ---------- */
// Geography: Natural Earth 1:50m (public domain), simplified. Coordinates are [lon, lat] × 100.
const GEO = JSON.parse(document.getElementById('geo').textContent);
const D2R=Math.PI/180, P1=49*D2R, P2=77*D2R, LAT0=63.390675*D2R, LON0=-91.866667*D2R;
const LN=Math.log(Math.cos(P1)/Math.cos(P2))/Math.log(Math.tan(Math.PI/4+P2/2)/Math.tan(Math.PI/4+P1/2));
const LF=Math.cos(P1)*Math.pow(Math.tan(Math.PI/4+P1/2),LN)/LN;
const RHO0=LF/Math.pow(Math.tan(Math.PI/4+LAT0/2),LN);

// the frame (Canada plus a wide margin of neighbouring land and sea) is fixed in the data,
// so the shaded-relief image, made for the same frame, lines up exactly
const [bx0,bx1,by0,by1]=GEO.frame;
const W=3600, SCL=W/(bx1-bx0), H=Math.round((by1-by0)*SCL);

const reliefImg=new Image();
const reliefReady=new Promise(r=>{reliefImg.onload=reliefImg.onerror=r});
reliefImg.src=document.getElementById('relief').textContent.trim();
function P(lat,lon){const[x,y]=lccRaw(lat,lon);return[(x-bx0)*SCL,(y-by0)*SCL]}
function unP(px,py){
  const x=px/SCL+bx0, yr=py/SCL+by0, a=RHO0+yr;
  const r=Math.hypot(x,a), t=Math.atan2(x,a);
  return{lon:(LON0+t/LN)/D2R,lat:(2*Math.atan(Math.pow(LF/r,1/LN))-Math.PI/2)/D2R};
}
const fmtLL=(lat,lon)=>`${Math.abs(lat).toFixed(2)}° ${lat>=0?'N':'S'}  ${Math.abs(lon).toFixed(2)}° ${lon<0?'W':'E'}`;

function pathOf(rings,closed=true){
  const p=new Path2D();
  rings.forEach(r=>{for(let i=0;i<r.length;i+=2){const[x,y]=P(r[i+1]/100,r[i]/100);i?p.lineTo(x,y):p.moveTo(x,y)}if(closed)p.closePath()});

const provPaths=GEO.prov.map(p=>({name:p.name,path:pathOf(p.rings)}));
const hitCtx=document.createElement('canvas').getContext('2d');
function provinceAt(x,y){
  for(const p of provPaths)if(hitCtx.isPointInPath(p.path,x,y,'evenodd'))return p.name;
  const {lat}=unP(x,y);return lat<49?'United States':'';
}

function drawTerrain(){
  // drawn once off-screen; drawMapView() copies the visible part into a screen-sized canvas
  // capped so the canvas stays under Safari's 16.7M-pixel canvas limit
  const cv=document.createElement('canvas'),k=vw<800?1:Math.min(1.25,Math.max(1,devicePixelRatio||1),Math.sqrt(16e6/(W*H)));
  cv.width=W*k;cv.height=H*k;mapSrc=cv;mapK=k;mvKey='';
  const ctx=cv.getContext('2d');ctx.scale(k,k);
  const C={ocean:css('--ocean'),oceanDeep:css('--ocean-deep'),land:css('--land'),landN:css('--land-north'),foreign:css('--land-foreign'),
    water:css('--water-line'),paper:css('--paper'),border:css('--border'),road:css('--road')};
  // ocean
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.oceanDeep);g.addColorStop(1,C.ocean);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const canLand=new Path2D();provPaths.forEach(p=>canLand.addPath(p.path));
  const other=pathOf(GEO.land.flatMap(l=>l.rings));
  const lakes=pathOf(GEO.lakes);
  const rivers=pathOf(GEO.rivers,false);
  // coastal ripple lines, the way engraved charts mark the shore
  ctx.lineJoin='round';
  for(let i=5;i>=1;i--){ctx.strokeStyle=hexA(C.water,.035+.015*(5-i));ctx.lineWidth=i*6;ctx.stroke(canLand);ctx.stroke(other)}
  // graticule under land
  const grat=new Path2D();
  for(let lat=45;lat<=80;lat+=5){for(let lon=-175;lon<=-20;lon+=1){const[x,y]=P(lat,lon);lon===-175?grat.moveTo(x,y):grat.lineTo(x,y)}}
  for(let lon=-170;lon<=-30;lon+=10){for(let lat=30;lat<=85;lat+=.5){const[x,y]=P(lat,lon);lat===30?grat.moveTo(x,y):grat.lineTo(x,y)}}
  ctx.strokeStyle=hexA(C.paper,.06);ctx.lineWidth=1;ctx.stroke(grat);
  // land
  ctx.fillStyle=C.foreign;ctx.fill(other,'evenodd');
  g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.landN);g.addColorStop(.55,C.land);g.addColorStop(1,C.land);
  ctx.fillStyle=g;ctx.fill(canLand,'evenodd');
  ctx.save();ctx.clip(canLand,'evenodd');ctx.strokeStyle=hexA(C.paper,.035);ctx.stroke(grat);ctx.restore();
  // lakes and rivers
  // terrain: relief multiplies over land and sea floor, so slopes shade the cream and grey
  if(reliefImg.naturalWidth){ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.72;
    ctx.imageSmoothingQuality='high';ctx.drawImage(reliefImg,0,0,W,H);ctx.restore()}
  // built-up areas around cities
  ctx.fillStyle=hexA(C.paper,.09);ctx.fill(pathOf(GEO.urban),'evenodd');
  ctx.fillStyle=C.ocean;ctx.fill(lakes,'evenodd');
  ctx.strokeStyle=hexA(C.water,.5);ctx.lineWidth=.8;ctx.stroke(lakes);
  ctx.strokeStyle=hexA(C.water,.38);ctx.lineWidth=1;ctx.stroke(rivers);
  // highways: secondary routes faint, major highways a little stronger
  const roads=[new Path2D(),new Path2D()];
  GEO.roads.forEach(r=>{const p=roads[r[0]];for(let i=1;i<r.length;i+=2){const[x,y]=P(r[i+1]/100,r[i]/100);i>1?p.lineTo(x,y):p.moveTo(x,y)}});
  ctx.lineCap='round';
  ctx.strokeStyle=hexA(C.road,.22);ctx.lineWidth=.7;ctx.stroke(roads[0]);
  ctx.strokeStyle=hexA(C.road,.5);ctx.lineWidth=1.1;ctx.stroke(roads[1]);
  // US state lines, lighter than provincial borders
  ctx.setLineDash([3,4]);ctx.strokeStyle=hexA(C.paper,.16);ctx.lineWidth=.8;ctx.stroke(pathOf(GEO.states,false));ctx.setLineDash([]);
  // borders + coast
  ctx.setLineDash([7,5]);ctx.strokeStyle=C.border;ctx.lineWidth=1.1;provPaths.forEach(p=>ctx.stroke(p.path));ctx.setLineDash([]);
  ctx.strokeStyle=hexA(C.paper,.5);ctx.lineWidth=1.1;ctx.stroke(canLand);
  ctx.strokeStyle=hexA(C.paper,.22);ctx.lineWidth=.9;ctx.stroke(other);
  // graticule labels on the frame edges
  ctx.font='400 12px "JetBrains Mono", monospace';ctx.fillStyle=hexA(C.paper,.4);
  for(let lon=-170;lon<=-30;lon+=10){for(let lat=30;lat<=85;lat+=.1){const[x,y]=P(lat,lon);if(y<H-16){if(x>30&&x<W-30){ctx.textAlign='center';ctx.fillText(`${-lon}°W`,x,H-14)}break}}}
  ctx.textAlign='left';
  for(let lat=45;lat<=80;lat+=5){for(let lon=-175;lon<=-20;lon+=.2){const[x,y]=P(lat,lon);if(x>14){if(y>20&&y<H-30)ctx.fillText(`${lat}°N`,18,y-4);break}}}
}

/* Labels keep a constant on-screen size, so whether two of them collide depends only on zoom.
   declutter() places them in priority order (projects, big cities, regions, towns), tries each
   label's sides in turn and hides whatever still overlaps; zooming in lets more of them back. */
const LABELS=[];
function placeCities(){
  const layer=$('#cities');
  CITIES.forEach(([name,lat,lon,tier,cap,side])=>{
    const[x,y]=P(lat,lon),el=document.createElement('span');
    el.className=`city t${tier}${cap===2?' nat':cap?' cap':''} side-r`;
    el.style.left=x+'px';el.style.top=y+'px';
    el.innerHTML='<i></i><span></span>';el.lastChild.textContent=name;
    layer.append(el);
    const sides=[...new Set([side||'r','r','l','b','t'])];
    LABELS.push({kind:'city',el,text:el.lastChild,x,y,dot:tier===3?3:4,sides,prio:tier===1?1:tier===2||cap?2:5});
  });
  REGION_LABELS.forEach(([name,lat,lon,size,foreign])=>{
    const[x,y]=P(lat,lon),el=document.createElement('span');
    el.className='region'+(size<14?' sm':'')+(foreign?' foreign':'');el.textContent=name;
    el.style.left=x+'px';el.style.top=y+'px';layer.append(el);
    LABELS.push({kind:'region',el,text:el,x,y,sides:['c'],prio:size<14||foreign?6:3});
  });
  WATER_LABELS.forEach(([name,lat,lon,size])=>{
    const[x,y]=P(lat,lon),el=document.createElement('span');
    el.className='region water'+(size<14?' sm':'');el.textContent=name;
    el.style.left=x+'px';el.style.top=y+'px';layer.append(el);
    LABELS.push({kind:'region',el,text:el,x,y,sides:['c'],prio:size<14?6:4});
  });
  PROJECTS.forEach(p=>LABELS.push({kind:'pin',el:p.pin,text:p.pin.querySelector('.pin-label'),x:p.x,y:p.y,p,
    sides:p.labelSide==='l'?['l','r']:['r','l'],prio:0}));
  LABELS.sort((a,b)=>a.prio-b.prio);
}
function measureLabels(){LABELS.forEach(l=>{l.w=l.text.offsetWidth;l.h=l.text.offsetHeight})}
let declutterS=0;
function declutter(){
  const s=cam.s;declutterS=s;
  const placed=[];
  const overlaps=b=>placed.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]);
  const add=(b,m=0)=>placed.push([b[0]-m,b[1]-m,b[2]+m,b[3]+m]);
  // markers and city dots are obstacles every label must avoid
  PROJECTS.forEach(p=>{if(!p.pin.classList.contains('is-dim'))add([p.x*s-15,p.y*s-15,p.x*s+15,p.y*s+15])});
  LABELS.forEach(l=>{if(l.kind==='city'&&l.prio<5)add([l.x*s-l.dot,l.y*s-l.dot,l.x*s+l.dot,l.y*s+l.dot])});
  for(const l of LABELS){
    if(l.kind==='pin'&&l.p.pin.classList.contains('is-dim'))continue;
    const ax=l.x*s,ay=l.y*s,w=l.w,h=l.h;
    const g=l.kind==='pin'||(l.kind==='city'&&PROJECTS.some(p=>Math.hypot(p.x-l.x,p.y-l.y)*s<16))?19:9;
    const box=side=>side==='r'?[ax+g,ay-h/2,ax+g+w,ay+h/2]:side==='l'?[ax-g-w,ay-h/2,ax-g,ay+h/2]
      :side==='b'?[ax-w/2,ay+g-2,ax+w/2,ay+g-2+h]:side==='t'?[ax-w/2,ay-g+2-h,ax+w/2,ay-g+2]:[ax-w/2,ay-h/2,ax+w/2,ay+h/2];
    let side=l.sides.find(sd=>!overlaps(box(sd)));
    if(!side&&l.kind==='pin')side=l.sides[0]; // project names always show
    if(side){
      add(box(side),4);
      if(l.kind==='city'){l.el.style.setProperty('--g',g+'px');l.el.classList.remove('side-r','side-l','side-b','side-t');l.el.classList.add('side-'+side)}
      if(l.kind==='pin')l.el.classList.toggle('label-l',side==='l');
      if(l.kind==='city'&&l.prio===5)add([ax-l.dot,ay-l.dot,ax+l.dot,ay+l.dot]);
    }
    l.el.classList.toggle('lbl-off',!side);
  }
}

/* ---------- colour helpers ---------- */
function hex2rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function hexA(h,a){const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`}
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}

/* ---------- generated placeholder frames ---------- */
const noiseCache=new Map();
const getNoise=s=>{if(!noiseCache.has(s))noiseCache.set(s,valueNoise(s));return noiseCache.get(s)};
const grainCv=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c})();
$('#grain').style.background=`url(${grainCv.toDataURL()})`;

function glow(ctx,x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexA(col,a));g.addColorStop(1,hexA(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function ridges(ctx,w,h,n,base,amp,layers,far,near,t,freq,oct,mist){
  for(let j=0;j<layers;j++){

    const by=base+j*h*.055,a=amp*(1-j*.14),drift=t*(3+j*7);
    ctx.beginPath();ctx.moveTo(0,h);
    for(let x=0;x<=w+6;x+=5)ctx.lineTo(x,by-fbm(n,(x+drift)/(w*freq)+j*7.3,j*2.1,oct)*a*1.6+a*.3);

    if(mist&&j<layers-1){const g=ctx.createLinearGradient(0,by-a*.4,0,by+h*.08);g.addColorStop(0,hexA(far,0));g.addColorStop(1,hexA(far,.32));ctx.fillStyle=g;ctx.fillRect(0,by-a*.4,w,h)}
  }

function clouds(ctx,w,h,col,t,R){
  for(let i=0;i<5;i++){const sp=.004+R()*.006;const cx=(((R()+t*sp)%1.3)-.15)*w,cy=h*(.1+R()*.3),r=w*(.15+R()*.2);
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,.16);glow(ctx,0,0,r,col,.28);ctx.restore()}
}
function drawScene(ctx,w,h,sc,t){
  const[top,hor,light,shade]=sc.pal, n=getNoise(sc.seed), R=mulberry32(sc.seed);

  const hz=h*(type==='mountain'?.5:type==='city'?.72:.58+(R()-.5)*.12);

  ctx.translate(w/2,h/2);ctx.scale(z,z);ctx.translate(-w/2,-h/2);
  let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,top);g.addColorStop(1,hor);
  ctx.fillStyle=g;ctx.fillRect(-w*.1,-h*.1,w*1.2,hz+h*.1+2);
  ctx.fillStyle=shade;ctx.fillRect(-w*.1,hz,w*1.2,h*1.1-hz);

  if(type==='dusk'||type==='mountain'){
    glow(ctx,sunX,sunY,w*.5,light,type==='mountain'?.35:.6);
    if(type==='dusk'){ctx.fillStyle=hexA(light,.95);ctx.beginPath();ctx.arc(sunX,sunY,h*.05,0,7);ctx.fill()}
    clouds(ctx,w,h,light,t,R);

      const px=[w*.12,w*.55,w*.98];px.forEach(x=>{ctx.beginPath();ctx.moveTo(x,h);ctx.lineTo(x,h*.38);ctx.moveTo(x-w*.025,h*.42);ctx.lineTo(x+w*.025,h*.42);ctx.stroke()});
      ctx.lineWidth=1;for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(px[0],h*.42);ctx.quadraticCurveTo((px[0]+px[1])/2,h*.5,px[1],h*.42);ctx.quadraticCurveTo((px[1]+px[2])/2,h*.5,px[2],h*.42);ctx.stroke()}
    }
  } else if(type==='sea'){
    glow(ctx,sunX,sunY,w*.45,light,.55);
    ctx.fillStyle=hexA(light,.9);ctx.beginPath();ctx.arc(sunX,sunY,h*.035,0,7);ctx.fill();
    clouds(ctx,w,h,light,t,R);
    ridges(ctx,w,h,n,hz+1,h*.03,1,hor,mixHex(hor,shade,.6),t*.2,.3,3,false);
    g=ctx.createLinearGradient(0,hz,0,h);g.addColorStop(0,mixHex(hor,shade,.3));g.addColorStop(1,shade);
    ctx.fillStyle=g;ctx.fillRect(-w*.1,hz+2,w*1.2,h);
    for(let k=0;k<70;k++){const f=k/70,y=hz+4+Math.pow(f,1.5)*(h-hz);
      const ww=w*(.015+f*.22)*(.4+n(k*.7,t*.8));const xc=sunX+(n(k,t*.5+3)-.5)*30;
      ctx.strokeStyle=hexA(light,.55*(1-f));ctx.lineWidth=1+f*2.5;ctx.beginPath();ctx.moveTo(xc-ww/2,y);ctx.lineTo(xc+ww/2,y);ctx.stroke()}
    ctx.strokeStyle=hexA(light,.07);ctx.lineWidth=1;
    for(let k=0;k<50;k++){const y=hz+R()*(h-hz),x=R()*w,l=w*(.02+R()*.08);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+l,y);ctx.stroke()}
    if(R()>.35){const bx=w*(.15+R()*.7),by=hz+(h-hz)*.3+Math.sin(t*1.3)*2,bw=w*.06;
      ctx.fillStyle=shade;ctx.beginPath();ctx.moveTo(bx-bw/2,by);ctx.lineTo(bx+bw/2,by);ctx.lineTo(bx+bw*.38,by+h*.018);ctx.lineTo(bx-bw*.4,by+h*.018);ctx.closePath();ctx.fill();
      ctx.fillRect(bx-bw*.12,by-h*.03,bw*.04,h*.03)}

    glow(ctx,w*.5,hz,w*.6,light,.4);
    for(let layer=0;layer<2;layer++){
      let x=-w*.05;const col=layer?shade:mixHex(hor,shade,.55);
      while(x<w*1.05){const bw=w*(layer?.05+R()*.07:.025+R()*.04),bh=h*(layer?.28+R()*.4:.18+R()*.3);

    const vx=(b.x-a.x)/dt,vy=(b.y-a.y)/dt;
    camV.x=-vx/cam.s;camV.y=-vy/cam.s;
    lock={x:cam.x-project(vx)/cam.s,y:cam.y-project(vy)/cam.s};
  }
  drag=null;
});
addEventListener('pointercancel',()=>drag=null);
document.addEventListener('mouseleave',()=>{if(!focus)lock={x:cam.x,y:cam.y}});


/* ---------- hover preview ---------- */
const pv=$('#preview');
pv.addEventListener('click',()=>{if(hot&&mode==='roam')openProject(hot)});
function hover(p){
  if(hot&&hot!==p)hot.pin.classList.remove('is-hot');
  hot=p&&mode==='roam'?p:null;
  if(!hot){pv.classList.remove('show');return}
  hot.pin.classList.add('is-hot');
  $('#pvImg').src=renderStill(hot,0,500);
  $('#pvMeta').textContent=`SC ${pad2(hot.sc)} · ${hot.kind} · ${hot.year}`;
  $('#pvTitle').textContent=hot.title;
  placePreview();pv.classList.add('show');
}
function placePreview(){
  const r=hot.pin.getBoundingClientRect(),pw=250,ph=pv.offsetHeight||230,cx=r.left+r.width/2,cy=r.top+r.height/2;
  let x,y;
  if(focus&&focus.c&&focus.c.members.includes(hot)){
    // in a zoomed group the card sits beside the whole group so it never covers another marker
    const g=groupRect(focus.c);
    x=g.right+60;if(x+pw>vw-16)x=g.left-60-pw;
    y=cy-ph/2;
  }else{
    x=r.right+18;y=r.top-ph-12;
    if(x+pw>vw-16)x=r.left-pw-18;
    if(y<16)y=r.bottom+12;
  }
  x=clamp(x,16,vw-pw-16);y=clamp(y,16,vh-ph-16);
  pv.style.left=x+'px';pv.style.top=y+'px';
  pv.style.transformOrigin=`${cx-x}px ${cy-y}px`; // the card grows out of its marker
}

/* ---------- filter + index ---------- */
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  PROJECTS.forEach(p=>{const off=filter!=='all'&&p.medium!==filter;p.pin.classList.toggle('is-dim',off);p.pin.tabIndex=off?-1:0;p.li.classList.toggle('is-dim',off)});
  releaseFocus();buildClusters();declutter();
}));
const visible=()=>PROJECTS.filter(p=>filter==='all'||p.medium===filter);
const indexEl=$('#index');
function toggleIndex(open){
  indexEl.classList.toggle('open',open);indexEl.inert=!open;$('#indexBtn').setAttribute('aria-expanded',String(open));
  if(open){PROJECTS.forEach(p=>{const im=p.li.querySelector('img');if(!im.src)im.src=renderStill(p,0,160)});setTimeout(()=>$('#indexClose').focus({preventScroll:true}),50)}
}
$('#indexBtn').addEventListener('click',()=>toggleIndex(!indexEl.classList.contains('open')));
$('#indexClose').addEventListener('click',()=>{toggleIndex(false);$('#indexBtn').focus()});

/* ---------- film (project view) ---------- */
const film=$('#film'), screen=$('#screen');
let anim=null, mediaIndex=0, returnFocus=null;

function openProject(p,fromFilm){
  if(!fromFilm)returnFocus=p.pin;
  clearTimeout(dwell);focus=null;hover(null);current=p;mode='fly';
  document.body.classList.add('is-flying');
  PROJECTS.forEach(q=>q.pin.classList.toggle('is-active',q===p));
  const s1=baseScale()*2.8;
  const go=()=>flyTo({x:p.x,y:p.y,s:s1,rx:RM?0:16,ry:RM?0:-4,c:1},fromFilm?2000:1700,{arc:fromFilm?.62:0,mid:()=>showFilm(p)},()=>{mode='film'});
  if(fromFilm){film.classList.remove('is-on');stopAnim();setTimeout(go,RM?0:450)}else go();
}
function showFilm(p){
  populate(p);
  film.hidden=false;film.scrollTop=0;
  document.body.classList.add('film-open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>film.classList.add('is-on')));
  $('#closeBtn').focus({preventScroll:true});
}
function closeFilm(){
  if(mode!=='film'&&mode!=='fly')return;
  film.classList.remove('is-on');document.body.classList.remove('film-open');stopAnim();
  setTimeout(()=>{if(!film.classList.contains('is-on'))film.hidden=true},700);
  tween=null;mode='fly';
  setTimeout(()=>{
    const t=roamTarget();
    flyTo({x:t.x,y:t.y,s:t.s,rx:0,ry:0,c:0},1500,{},()=>{
      mode='roam';document.body.classList.remove('is-flying');
      PROJECTS.forEach(q=>q.pin.classList.remove('is-active'));
      returnFocus&&returnFocus.focus({preventScroll:true});
    });
  },RM?0:250);
}
function step(dir){
  if(mode!=='film')return;
  const list=visible(),i=list.indexOf(current);
  const next=list[(i+dir+list.length)%list.length];
  if(next&&next!==current){returnFocus=next.pin;openProject(next,true)}
}
function populate(p){
  const list=visible(),i=Math.max(0,list.indexOf(p));
  film.style.setProperty('--ar',p.aspect);
  $('#fSlate').textContent=`SC ${pad2(p.sc)}`;$('#fKind').textContent=p.kind;$('#fYear').textContent=p.year;
  const t=$('#fTitle');t.textContent='';
  p.title.split(' ').forEach((w,k)=>{const o=document.createElement('span');o.className='w';const s=document.createElement('span');
    s.textContent=w;s.style.setProperty('--d',300+k*90);o.append(s);t.append(o,' ')});
  $('#fSynopsis').textContent=p.synopsis;
  const rows=[['Role',p.role],['Client',p.client],['Camera',p.camera],['Lens',p.lens],['Format',p.format],
    [p.medium==='film'?'Runtime':'Frames',p.length],['Location',p.place],['Coordinates',fmtLL(p.pos[0],p.pos[1])]];
  const dl=$('#fMeta');dl.textContent='';
  rows.forEach(([k,v])=>{if(!v)return;const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd)});
  const th=$('#fThumbs');th.textContent='';
  p.media.forEach((m,k)=>{
    const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',`Frame ${k+1}: ${m.caption||''}`);
    const im=document.createElement('img');im.alt='';im.src=renderStill(p,k,240);b.append(im);
    if(m.type==='video'){const s=document.createElement('span');s.className='play';s.textContent='▶ MOV';b.append(s)}
    b.addEventListener('click',()=>showMedia(p,k));th.append(b);
  });
  $('#fAspect').textContent=(p.aspect===2.39?'2.39':p.aspect===16/9?'16:9':p.aspect===4/5?'4:5':p.aspect===3/2?'3:2':p.aspect.toFixed(2))+(p.aspect>1.6?' : 1':'');
  $('#bSlate').textContent=`SC ${pad2(p.sc)} · ${p.year}`;$('#bTitle').textContent=p.title;
  const prev=list[(i-1+list.length)%list.length],next=list[(i+1)%list.length];
  $('#prevLbl').textContent=prev&&prev!==p?prev.title:'';$('#nextLbl').textContent=next&&next!==p?next.title:'';
  $('#prevBtn').hidden=$('#nextBtn').hidden=list.length<2;
  $('#bCount').textContent=`${pad2(i+1)} / ${pad2(list.length)}`;
  screen.querySelectorAll('.layer').forEach(l=>l.remove());
  showMedia(p,0);
}
function showMedia(p,i){
  mediaIndex=i;stopAnim();
  const m=p.media[i],layer=document.createElement('div');layer.className='layer';
  let el;
  if(m.src&&m.type==='video'){el=document.createElement('video');Object.assign(el,{src:m.src,muted:true,loop:true,autoplay:true,playsInline:true});if(m.poster)el.poster=m.poster}
  else if(m.src){el=document.createElement('img');el.src=m.src;el.alt=m.caption||p.title}
  else if(m.type==='video'){el=document.createElement('canvas');el.width=960;el.height=Math.round(960/p.aspect);anim={cv:el,ctx:el.getContext('2d'),sc:sceneFor(p,i),t0:performance.now()};drawAnim(performance.now())}
  else{el=document.createElement('img');el.src=renderStill(p,i,1600);el.alt=m.caption||p.title}
  el.classList.add('media');if(m.type!=='video'&&!RM)el.classList.add('kb');
  layer.append(el);screen.insertBefore(layer,screen.querySelector('.vf'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add('in')));
  const layers=screen.querySelectorAll('.layer');
  layers.forEach((l,k)=>{if(k<layers.length-1){l.classList.remove('in');setTimeout(()=>l.remove(),1100)}});
  $('#fCaption').textContent=m.caption||'';
  $('#fExif').textContent=m.type==='video'?'Moving image':(m.exif||'');
  $('#fTc').innerHTML=m.type==='video'?'<span class="rec">TC 00:00:00:00</span>':`Frame ${pad2(i+1)} / ${pad2(p.media.length)}`;
  $('#fThumbs').querySelectorAll('.thumb').forEach((b,k)=>b.setAttribute('aria-current',String(k===i)));
}
function drawAnim(now){
  const a=anim;if(!a)return;const t=(now-a.t0)/1000;
  drawScene(a.ctx,a.cv.width,a.cv.height,a.sc,t);
  const f=Math.floor(t*24),tc=`${pad2(Math.floor(f/86400))}:${pad2(Math.floor(f/1440)%60)}:${pad2(Math.floor(f/24)%60)}:${pad2(f%24)}`;
  const r=$('#fTc .rec');if(r)r.textContent='TC '+tc;
}
function stopAnim(){anim=null}

$('#closeBtn').addEventListener('click',closeFilm);
$('#prevBtn').addEventListener('click',()=>step(-1));
$('#nextBtn').addEventListener('click',()=>step(1));
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(indexEl.classList.contains('open')){toggleIndex(false);$('#indexBtn').focus()}else if(mode==='film')closeFilm();else if(focus)releaseFocus()}
  if(mode==='film'&&!e.target.closest('input,textarea')){
    if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);
  }
});
// keep focus inside the project view while it is open
addEventListener('focusin',e=>{if(document.body.classList.contains('film-open')&&!e.target.closest('.film,.bar-ui'))$('#closeBtn').focus({preventScroll:true})});

/* ---------- boot ---------- */
requestAnimationFrame(frame);
Promise.all([reliefReady,Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))])]).then(()=>{
  drawTerrain();placeCities();measureLabels();declutter();buildClusters();
  PROJECTS.forEach(p=>renderStill(p,0,500));
  setTimeout(()=>{introStart=performance.now()},RM?0:500);
});
</script>
</body></html>
